<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>치지직 이모티콘 단축키</title>
<link rel="stylesheet" href="popup.css">
<main>
  <small>CHZZ SHORTCUT</small>
  <h1>자주 쓰는 이모티콘,<br>숫자키 하나 가까이.</h1>
  <p>치지직 채팅 입력창 옆 <b>⌨</b> 버튼에서<br>1~9번 슬롯을 등록하세요.</p>
  <ol><li>슬롯의 <b>등록</b> 버튼 클릭</li><li>이모티콘 팩을 선택하고 이모티콘 클릭</li><li>채팅창에서 <b>Alt + 숫자</b>로 삽입</li></ol>
  <p class="note">Mac은 Option + 숫자. 전송은 직접 Enter.<br>설정에서 Alt + Shift 조합도 선택할 수 있습니다.</p>
  <footer>버튼이 안 보이면 치지직 탭을 새로고침하세요.</footer>
</main>
</html>
